<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NitroPay Test Page - Heartopia.life</title>

    <script
        data-cfasync="false">window.nitroAds = window.nitroAds || { createAd: function () { return new Promise(e => { window.nitroAds.queue.push(["createAd", arguments, e]) }) }, addUserToken: function () { window.nitroAds.queue.push(["addUserToken", arguments]) }, queue: [] };</script>
    <script data-cfasync="false" async src="https://s.nitropay.com/ads-2368.js"></script>

</head>

<body>
    <div style="max-width: 800px; margin: 50px auto; text-align: center; font-family: sans-serif;">
        <h1>NitroPay 测试页面</h1>
        <p>这是用来测试 Nitro 广告代码的沙盒环境。不影响主站流量。</p>
        <hr>
        <div id="test-banner-1" style="height:250px"></div>

        <script>
            window['nitroAds'].createAd('test-banner-1', {
                "height": 250,
                "delayLoading": true,
                "report": {
                    "enabled": true,
                    "icon": true,
                    "wording": "Report Ad",
                    "position": "top-right"
                }
            });
        </script>
        <hr>
        <p>如果一切正常，加上 ?nitro_demo=1 后，上方应该出现广告占位符。</p>
    </div>
</body>

</html>
