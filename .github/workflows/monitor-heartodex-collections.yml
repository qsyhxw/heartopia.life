name: Auto Sync Heartodex Collections

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heartodex-collection-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Read public collection listings
        run: node scripts/monitor-heartodex-collections.mjs

      - name: Validate details and download new images
        run: node scripts/prepare-heartodex-fish-bird-sync.mjs

      - name: Apply verified additions
        run: node scripts/apply-heartodex-fish-bird-sync.mjs

      - name: Refresh Fish shared pages
        run: node scripts/sync-fish-pages.mjs

      - name: Refresh Insect database
        run: node scripts/sync-insect-database.mjs

      - name: Sync Wildlife details and database
        run: node scripts/sync-heartodex-wildlife.mjs

      - name: Commit automatic collection updates
        run: |
          if git diff --quiet; then
            echo "No collection change detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/fish/index.html database/birds/index.html database/insects/index.html database/wildlife/index.html data/heartopia-fish.json data/heartopia-insects.json data/heartopia-wildlife.json data/monitor/heartodex-collections.json data/monitor/heartodex-sync-readiness.json img/fish img/birds img/insects img/wildlife assets/js/my-progress-dashboard.js tools/my-progress/index.html guides/fishing-locations/index.html guides/fishing-spots/index.html guides/rare-fish/index.html guides/fish-locations/index.html database/fish-prices/index.html
          git commit -m "chore: auto-sync Heartodex collections"
          git push
