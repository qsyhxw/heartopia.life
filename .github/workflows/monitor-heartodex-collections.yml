name: Auto Sync Heartodex Collections

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heartodex-collection-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Read public collection listings
        run: node scripts/monitor-heartodex-collections.mjs

      - name: Validate details and download new images
        run: node scripts/prepare-heartodex-fish-bird-sync.mjs

      - name: Apply verified additions
        run: node scripts/apply-heartodex-fish-bird-sync.mjs

      - name: Refresh Fish shared pages
        run: node scripts/sync-fish-pages.mjs

      - name: Refresh Insect database
        run: node scripts/sync-insect-database.mjs

      - name: Sync Wildlife details and database
        run: node scripts/sync-heartodex-wildlife.mjs

      - name: Sync Crop details and planning pages
        run: node scripts/sync-heartodex-crops.mjs

      - name: Sync Flowers database and images
        run: node scripts/sync-heartodex-flowers.mjs

      - name: Build Flowers database page
        run: node scripts/build-flowers-page.mjs

      - name: Sync Recipe details, prices, and tools
        run: node scripts/sync-heartodex-recipes.mjs

      - name: Sync Achievement details and progress
        run: node scripts/sync-heartodex-achievements.mjs

      - name: Monitor and sync Heartopia events
        run: node scripts/sync-heartodex-events.mjs

      - name: Refresh database and progress hub totals
        run: node scripts/sync-heartopia-hubs.mjs

      - name: Build My Progress catalog
        run: node scripts/build-progress-catalog.mjs

      - name: Build universal search index
        run: node scripts/build-heartopia-search-index.mjs

      - name: Attach database map links
        run: node scripts/add-map-entity-links.mjs

      - name: Commit automatic collection updates
        run: |
          if git diff --quiet; then
            echo "No collection change detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/index.html data/heartopia-hub-totals.json data/heartopia-search-index.json database/fish database/birds database/insects/index.html database/wildlife database/materials database/crops/index.html database/flowers/index.html database/recipes/index.html database/ingredients/index.html database/items/index.html npcs/index.html guides/best-crops/index.html guides/flower-crossbreeding/index.html tools/crop-planner/index.html hobbies/gardening/index.html database/recipe-prices/index.html guides/best-food-to-sell/index.html tools/recipe-calculator/index.html guides/achievements/index.html data/heartopia-fish.json data/heartopia-insects.json data/heartopia-wildlife.json data/heartopia-crops.json data/heartopia-flowers.json data/heartopia-recipes.json data/heartopia-achievements.json data/monitor/heartodex-collections.json data/monitor/heartodex-sync-readiness.json img/fish img/birds img/insects img/wildlife img/crops img/flowers img/recipes img/achievements assets/js/my-progress-dashboard.js assets/js/my-progress-assistant.js assets/js/progress-catalog.js assets/js/database-search-query.js assets/js/universal-search.js assets/js/map-entity-links.js assets/js/map-location-finder.js scripts/add-map-entity-links.mjs guides/map/index.html tools/my-progress/index.html tools/search/index.html guides/fishing-locations/index.html guides/fishing-spots/index.html guides/rare-fish/index.html guides/fish-locations/index.html database/fish-prices/index.html data/monitor/heartodex-events.json events/index.html events/*/index.html sitemap.xml
          git commit -m "chore: auto-sync Heartodex collections"
          git push
