name: Validate DREADMOOR guides
on:
  push:
    paths:
      - 'dreadmoor/**'
      - 'assets/dreadmoor/**'
      - 'config/dreadmoor-*.json'
      - 'scripts/*dreadmoor*'
      - 'scripts/build-loftia.mjs'
      - 'index.html'
      - '.github/workflows/validate-dreadmoor.yml'
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python scripts/build_dreadmoor.py
      - run: python scripts/check_dreadmoor.py
      - run: python scripts/check_guide_layout.py
      - run: node scripts/audit-monthly-integrations.mjs
      - run: git diff --exit-code -- index.html sitemap.xml dreadmoor/
