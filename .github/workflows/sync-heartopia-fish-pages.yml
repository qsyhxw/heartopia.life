name: Sync Heartopia Fish Pages

on:
  push:
    paths:
      - 'database/fish/index.html'
      - 'data/heartopia-fish.json'
      - 'img/fish/**'
      - 'scripts/sync-fish-pages.mjs'
      - 'scripts/generate-fish-detail-pages.mjs'
      - 'scripts/refresh-legacy-fish-references.mjs'
      - 'scripts/refresh-collection-legacy-pages.mjs'
      - 'scripts/sync-heartopia-hubs.mjs'
      - 'scripts/build-progress-catalog.mjs'
      - 'scripts/build-heartopia-search-index.mjs'
      - 'scripts/add-map-entity-links.mjs'
      - 'scripts/build-sitemap.mjs'
      - 'assets/js/map-entity-links.js'
      - 'assets/js/map-location-finder.js'
      - 'guides/map/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-fish-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build shared fish data and page sections
        run: node scripts/sync-fish-pages.mjs

      - name: Build fish detail pages
        run: node scripts/generate-fish-detail-pages.mjs

      - name: Refresh legacy fish references
        run: node scripts/refresh-legacy-fish-references.mjs

      - name: Refresh database and progress hub totals
        run: node scripts/sync-heartopia-hubs.mjs

      - name: Build My Progress catalog
        run: node scripts/build-progress-catalog.mjs

      - name: Build universal search index
        run: node scripts/build-heartopia-search-index.mjs

      - name: Attach database map links
        run: node scripts/add-map-entity-links.mjs

      - name: Refresh XML sitemap
        run: node scripts/build-sitemap.mjs

      - name: Commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heartopia-fish.json data/heartopia-hub-totals.json data/heartopia-search-index.json sitemap.xml scripts/generate-fish-detail-pages.mjs scripts/add-map-entity-links.mjs scripts/build-sitemap.mjs database/index.html database/fish database/birds database/wildlife database/materials database/fish-prices/index.html guides/map/index.html guides/fishing-locations/index.html guides/fishing-spots/index.html guides/rare-fish/index.html guides/fish-locations/index.html scripts/refresh-legacy-fish-references.mjs assets/js/my-progress-dashboard.js assets/js/my-progress-assistant.js assets/js/progress-catalog.js assets/js/universal-search.js assets/js/map-entity-links.js assets/js/map-location-finder.js tools/my-progress/index.html hobbies/fishing/index.html hobbies/index.html progression/money-making/index.html guides/money-making/index.html guides/hidden-achievements/index.html
          if git diff --cached --quiet; then
            echo "No fish page changes to commit."
          else
            git commit -m "chore: sync Heartopia fish pages"
            git push
          fi
