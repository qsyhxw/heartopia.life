name: Sync Heartopia Insect Database

on:
  push:
    paths:
      - 'data/heartopia-insects.json'
      - 'img/insects/**'
      - 'scripts/sync-insect-database.mjs'
      - 'scripts/refresh-collection-legacy-pages.mjs'
      - 'scripts/sync-heartopia-hubs.mjs'
      - 'scripts/build-progress-catalog.mjs'
      - 'scripts/build-heartopia-search-index.mjs'
      - 'scripts/audit-auto-sync.mjs'
      - 'scripts/version-local-assets.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heartopia-derived-sync
  cancel-in-progress: false

jobs:
  sync-insects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build insect database
        run: node scripts/sync-insect-database.mjs
      - name: Refresh legacy collection pages
        run: node scripts/refresh-collection-legacy-pages.mjs
      - name: Refresh database and progress hub totals
        run: node scripts/sync-heartopia-hubs.mjs
      - name: Refresh My Progress catalog
        run: node scripts/build-progress-catalog.mjs
      - name: Build universal search index
        run: node scripts/build-heartopia-search-index.mjs
      - name: Version local JavaScript assets
        run: node scripts/version-local-assets.mjs
      - name: Audit tools and shared data
        run: node scripts/audit-tools.mjs
      - name: Audit auto-sync cache and totals
        run: node scripts/audit-auto-sync.mjs
      - name: Commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heartopia-hub-totals.json data/heartopia-search-index.json database/index.html database/insects scripts/refresh-collection-legacy-pages.mjs scripts/version-local-assets.mjs scripts/audit-auto-sync.mjs assets/js/my-progress-dashboard.js assets/js/my-progress-assistant.js assets/js/progress-catalog.js assets/js/universal-search.js tools/my-progress/index.html hobbies/insect-catching/index.html guides/index.html tools/index.html hobbies/index.html hobbies/fishing/index.html events/winter-2026/index.html database/fish/rainbow-fish/index.html database/fish/legendary-koi/index.html
          if git diff --cached --quiet; then
            echo "No insect database changes to commit."
          else
            git commit -m "chore: sync Heartopia insect database"
            git push
          fi
