name: Update Heartopia Codes

on:
  schedule:
    - cron: '20 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heartopia-derived-sync
  cancel-in-progress: false

jobs:
  update-codes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch and render codes
        run: |
          node scripts/update-heartopia-codes.mjs
          node scripts/render-ja-codes.mjs
          node scripts/render-zh-tw-codes.mjs
          node scripts/render-id-ptbr-core-pages.mjs

      - name: Show changes
        run: git diff -- data/heartopia-codes.json codes/index.html ja/codes/index.html zh-tw/codes/index.html id/codes/index.html pt-br/codes/index.html sitemap.xml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heartopia-codes.json codes/index.html ja/codes/index.html zh-tw/codes/index.html id/codes/index.html pt-br/codes/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No code changes to commit."
          else
            git commit -m "chore: update Heartopia codes"
            git push
          fi
